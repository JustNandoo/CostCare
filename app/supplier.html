<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Supplier &amp; Kendaraan — CostCare</title>
  <link rel="icon" href="../assets/img/favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../assets/css/base.css?v=2">
  <link rel="stylesheet" href="../assets/css/app.css?v=2">
</head>
<body>
<div class="shell">
  <header class="topbar" id="topbar"></header>

  <main id="main" class="col">
    <div class="page-head">
      <div>
        <div class="eyebrow" id="subtitle">Data master</div>
        <h1>Supplier &amp; Kendaraan</h1>
      </div>
      <div class="page-actions">
        <div class="segmented" role="tablist" aria-label="Jenis data" id="kind">
          <button type="button" role="tab" data-kind="supplier" aria-selected="true">Supplier</button>
          <button type="button" role="tab" data-kind="kendaraan" aria-selected="false">Kendaraan</button>
        </div>
        <button type="button" class="btn btn-primary btn-pill" id="add-btn" hidden>+ Tambah supplier</button>
      </div>
    </div>

    <!-- Tab supplier -->
    <div class="row" id="tab-supplier">
      <section class="card f1" aria-label="Daftar supplier" style="padding:14px;gap:6px;flex-basis:340px">
        <label class="searchbox soft">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#5B6E66" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>
          <span class="sr-only">Cari supplier</span>
          <input type="search" id="sq" placeholder="Nama, ID, plat, atau nomor kartu" autocomplete="off">
        </label>
        <div class="pilltabs" id="sfilter" role="tablist" aria-label="Status supplier" style="gap:6px;padding:4px 0"></div>
        <div class="col" style="gap:2px" id="slist"></div>
        <span class="small muted-2" style="padding:6px 12px" id="scount"></span>
      </section>
      <section class="col f2" id="profile" aria-live="polite"></section>
    </div>

    <!-- Tab kendaraan -->
    <section class="card" id="tab-kendaraan" hidden style="padding:16px 12px 12px">
      <div class="card-head" style="padding:0 12px">
        <label class="searchbox soft" style="min-width:280px">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#5B6E66" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>
          <span class="sr-only">Cari kendaraan</span>
          <input type="search" id="vq" placeholder="Plat, jenis, atau supplier" autocomplete="off">
        </label>
        <span class="small muted-2" id="vcount"></span>
      </div>
      <div class="table-wrap">
        <table class="rows" style="min-width:860px">
          <thead><tr><th>Plat nomor</th><th>Jenis</th><th>Supplier</th><th class="right">Tara riwayat</th><th class="right">Trx 30 hari</th><th>Status</th><th><span class="sr-only">Aksi</span></th></tr></thead>
          <tbody id="vlist"></tbody>
        </table>
      </div>
      <p class="small muted" style="padding:4px 12px">Tara riwayat dipakai untuk menandai tara yang menyimpang. Pengenalan plat otomatis (ANPR) ada di roadmap.</p>
    </section>
  </main>
</div>
<div id="toast-root" class="toast-root" aria-live="polite"></div>
<script src="../assets/js/store.js?v=2"></script>
<script src="../assets/js/ui.js?v=2"></script>
<script src="../assets/js/pages/supplier.js?v=2"></script>
</body>
</html>
