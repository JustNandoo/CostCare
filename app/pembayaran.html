<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Nota &amp; Pembayaran — CostCare</title>
  <link rel="icon" href="../assets/img/favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../assets/css/base.css?v=2">
  <link rel="stylesheet" href="../assets/css/app.css?v=2">
</head>
<body>
<div class="shell">
  <header class="topbar" id="topbar"></header>

  <main id="main" class="col">
    <div class="page-head">
      <div>
        <div class="eyebrow">Keuangan · pencatatan saja, CostCare tidak mentransfer uang</div>
        <h1>Nota &amp; Pembayaran</h1>
      </div>
      <div class="page-actions">
        <label class="searchbox" style="min-width:260px">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#5B6E66" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>
          <span class="sr-only">Cari nota</span>
          <input type="search" id="q" placeholder="Supplier atau no. nota" autocomplete="off">
        </label>
        <button type="button" class="btn btn-teal btn-pill" id="export-btn">Ekspor rekap</button>
      </div>
    </div>

    <div class="kpis" id="kpis"></div>

    <div class="row">
      <section class="board f3" id="board" aria-label="Papan nota"></section>
      <section class="card f15" id="detail" aria-live="polite" style="flex-basis:380px"></section>
    </div>
  </main>
</div>
<div id="toast-root" class="toast-root" aria-live="polite"></div>
<script src="../assets/js/store.js?v=2"></script>
<script src="../assets/js/ui.js?v=2"></script>
<script src="../assets/js/pages/pembayaran.js?v=2"></script>
</body>
</html>
