<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Timbang Langsung — CostCare</title>
  <link rel="icon" href="../assets/img/favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../assets/css/base.css?v=2">
  <link rel="stylesheet" href="../assets/css/app.css?v=2">
</head>
<body>
<div class="shell">
  <header class="topbar" id="topbar"></header>

  <main id="main" class="col">
    <div class="page-head">
      <div>
        <div class="eyebrow"><span id="clock">—</span> · <span class="mono" id="trx-meta">Belum ada transaksi aktif</span></div>
        <h1>Timbang Langsung</h1>
      </div>
      <div class="page-actions">
        <span class="chip" style="background:#fff;height:36px"><span class="dot" style="background:#3BA55C"></span>Server tersambung</span>
        <span class="chip" style="background:#fff;height:36px" id="queue-chip">Antrian: —</span>
      </div>
    </div>

    <div class="row">
      <!-- Kolom kiri: pembacaan timbangan -->
      <section class="f3 col" aria-label="Pembacaan timbangan">
        <div class="scale-panel">
          <img class="watermark" src="../assets/img/costcare-mark.png" alt="" style="right:-60px;bottom:-70px;width:320px">
          <div class="scale-top">
            <div class="segmented dark" role="radiogroup" aria-label="Pilih jembatan timbang" id="scale-select">
              <button type="button" role="radio" data-scale="t1" aria-checked="true"><span class="dot-inline"></span>Timbangan 01</button>
              <button type="button" role="radio" data-scale="t2" aria-checked="false">Timbangan 02</button>
            </div>
            <span class="meta" id="scale-meta">—</span>
          </div>

          <div style="display:flex;flex-direction:column;gap:10px">
            <span class="scale-chip" id="scale-chip" role="status"><span class="dot"></span><span id="scale-chip-text">—</span></span>
            <div class="readout" id="readout">
              <span class="w" id="reading" aria-live="off">0</span><span class="u">kg</span>
            </div>
            <span class="stage-text" id="stage-text">—</span>
          </div>

          <div class="stab">
            <div class="stab-top"><b id="stab-label">—</b><span id="stab-rule">syarat —</span></div>
            <div class="stab-bar" id="stab-bar" role="meter" aria-label="Kestabilan pembacaan" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><i id="stab-fill" style="width:0%"></i></div>
          </div>

          <div id="scale-actions"></div>
        </div>

        <div id="phase-area"></div>

        <div class="card">
          <div class="card-head">
            <h2 id="journey-title">Perjalanan truk</h2>
            <button type="button" class="btn-link danger" id="cancel-btn" hidden>Batalkan transaksi</button>
          </div>
          <ol class="journey" id="journey" aria-label="Tahapan transaksi"></ol>
        </div>

        <div class="sim-bar" role="group" aria-label="Simulator timbangan">
          <span class="lbl">SIMULATOR DEMO — bukan perangkat nyata</span>
          <button type="button" data-sim="stabil" aria-pressed="true">Stabil</button>
          <button type="button" data-sim="goyang" aria-pressed="false">Bergoyang</button>
          <button type="button" data-sim="terputus" aria-pressed="false">Putuskan</button>
        </div>
      </section>

      <!-- Kolom kanan: supplier, tiket, antrian -->
      <aside class="f2 col" aria-label="Supplier dan perhitungan" style="flex-basis:380px">
        <div id="rfid"></div>
        <dl class="mini-stats" id="vinfo"></dl>
        <div class="card" id="ticket-card" style="padding:20px 22px"></div>
        <div class="card" style="padding:18px 20px">
          <div class="card-head">
            <h2 style="font-size:15px">Antrian &amp; truk menunggu</h2>
            <button type="button" class="btn btn-sm btn-outline" id="tap-btn">Tap kartu (simulasi)</button>
          </div>
          <div class="col" style="gap:8px" id="queue"></div>
        </div>
      </aside>
    </div>
  </main>
</div>
<div id="toast-root" class="toast-root" aria-live="polite"></div>
<script src="../assets/js/store.js?v=2"></script>
<script src="../assets/js/ui.js?v=2"></script>
<script src="../assets/js/pages/timbang.js?v=2"></script>
</body>
</html>
