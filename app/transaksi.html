<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Transaksi — CostCare</title>
  <link rel="icon" href="../assets/img/favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../assets/css/base.css?v=2">
  <link rel="stylesheet" href="../assets/css/app.css?v=2">
</head>
<body>
<div class="shell">
  <header class="topbar" id="topbar"></header>

  <main id="main" class="col">
    <div class="page-head">
      <div>
        <div class="eyebrow" id="subtitle">—</div>
        <h1>Transaksi</h1>
      </div>
      <form class="page-actions" id="filters" role="search" onsubmit="return false">
        <label class="searchbox" style="min-width:280px">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#5B6E66" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>
          <span class="sr-only">Cari transaksi</span>
          <input type="search" id="q" placeholder="Supplier, plat, atau no. transaksi" autocomplete="off">
        </label>
        <label class="sr-only" for="range">Periode</label>
        <select class="select-pill input" id="range" style="width:auto;min-height:46px">
          <option value="hari">Hari ini</option>
          <option value="kemarin">Kemarin</option>
          <option value="7">7 hari terakhir</option>
          <option value="30">30 hari terakhir</option>
        </select>
        <label class="sr-only" for="op">Operator</label>
        <select class="select-pill input" id="op" style="width:auto;min-height:46px"><option value="">Semua operator</option></select>
        <button type="button" class="btn btn-teal btn-pill" id="export-btn">Ekspor CSV</button>
      </form>
    </div>

    <div class="pilltabs" role="tablist" aria-label="Status transaksi" id="tabs" style="padding:0 8px"></div>

    <div class="row">
      <section class="card f3" aria-label="Daftar transaksi" style="padding:10px;gap:4px">
        <div class="list" id="list"></div>
        <div class="list-foot"><span id="count">—</span><span class="pager" id="pager"></span></div>
      </section>

      <section class="col f2" id="detail" aria-live="polite" style="flex-basis:400px"></section>
    </div>
  </main>
</div>
<div id="toast-root" class="toast-root" aria-live="polite"></div>
<script src="../assets/js/store.js?v=2"></script>
<script src="../assets/js/ui.js?v=2"></script>
<script src="../assets/js/pages/transaksi.js?v=2"></script>
</body>
</html>
